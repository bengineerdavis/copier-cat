[project]
name = "copier-cat"
version = "0.1.0"
description = "Template manager for copier: adopt templates into existing projects, phone-home PRs upstream, collections of templates with a chooser."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "copier>=9.8",
    "pyyaml>=6.0.3",
    "tomli-w>=1.2.0",
    "typer>=0.27.3",
]
license-files = [
    "LICENSE*",
]
authors = [
    { name = "Ben Davis", email = "bengineerdavis@gmail.com" },
]
keywords = [
    "cli",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]

[project.scripts]
copier-cat = "copier_cat.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.14",
    "pyrefly>=0.5",
    "tombi>=1.5.5,<2",
    "mypy>=1",
]

[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/copier_cat",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"src/copier_cat/cli.py" = [
    "B008",
]

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
ignore_missing_imports = true
