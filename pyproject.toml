[project]
name = "copier-cat"
version = "0.1.0"
description = "Template manager for copier: adopt templates into existing projects, phone-home PRs upstream, collections of templates with a chooser."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["copier>=9.8"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.14", "pyrefly>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/copier_cat"]

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
