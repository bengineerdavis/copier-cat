[tools]
uv = "latest"
python = "3.12"
prek = "0.5.5"
"pipx:backlog-md-py" = "2.1.0"

[tasks.install]
description = "Bootstrap tools, venv, and hooks"
run = "#!/usr/bin/env bash\nset -euo pipefail\nmise install uv python prek || true\nuv sync --all-groups\nuv run prek install --force 2>/dev/null || prek install --force\n"

[tasks.test]
description = "Unit tests"
run = "uv run pytest tests/ -x -q"

[tasks.lint]
description = "Lint and type-check (non-mutating)"
run = "uv run ruff check src tests && uv run pyrefly check src tests"

[tasks.lint-fix]
description = "Apply lint fixes"
run = "uv run ruff check --fix src tests && uv run ruff format src tests"

[tasks.format]
description = "Auto-fix lint findings and format"
run = "#!/usr/bin/env bash\nset -euo pipefail\nuv run ruff check --fix src tests\nuv run ruff format src tests\n"

[tasks.format-check]
description = "Verify formatting and lint cleanliness"
run = "#!/usr/bin/env bash\nset -euo pipefail\nuv run ruff format --check src tests\nuv run ruff check src tests\n"

[tasks.type-check]
description = "Mypy over src"
run = "uv run mypy src"

[tasks.quality]
description = "All code-quality gates (lint, format, types)"
depends = [
    "lint",
    "format-check",
    "type-check",
]
