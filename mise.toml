# Development harness for THIS repository (copier-cat itself).
# copier-cat's stamped projects get what adopt generates, not this file.

#:schema https://mise.jdx.dev/schema/mise.json

[tools]
uv = "latest"
python = "3.12"
prek = "0.5.5"

# tombi and copier are deliberately absent: both are project dependencies
# (pyproject.toml dev group / dependencies), so `uv run` resolves them from
# uv.lock — one authoritative manifest per tool (review 129, findings 4
# and 10). mise pins here were dead: no task or hook invoked them.

[tasks.install]
description = "Bootstrap tools, venv, and hooks"
run = '''
#!/usr/bin/env bash
set -euo pipefail
mise install uv python prek || true
uv sync --all-groups
uv run prek install --force 2>/dev/null || prek install --force
'''

[tasks.test]
description = "Unit tests"
run = "uv run pytest tests/ -x -q"

[tasks.lint]
description = "Lint and type-check (non-mutating)"
run = "uv run ruff check src tests && uv run pyrefly check src tests"

[tasks.lint-fix]
description = "Apply lint fixes"
run = "uv run ruff check --fix src tests && uv run ruff format src tests"
