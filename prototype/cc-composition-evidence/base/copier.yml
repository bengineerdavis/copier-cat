_min_copier_version: "9.18.2"
_templates_suffix: .jinja
_subdirectory: template
_answers_file: .copier-answers.{{ template_name }}.yml
_envops:
  trim_blocks: true
  undefined: jinja2.StrictUndefined

template_name:
  type: str
  default: base
  when: false

project_name:
  type: str
  default: demo

python_version:
  type: str
  default: "3.12"
